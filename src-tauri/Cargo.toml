[package]
name = "tvbox-studio"
version = "0.1.0"
description = "TVBox Studio - 一站式TVBox规则管理工具"
authors = ["TVBox Studio"]
edition = "2021"

[lib]
name = "tvbox_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri          = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs     = "2"
tauri-plugin-http   = "2"
tauri-plugin-shell  = "2"

serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
serde-aux    = "4"

tokio        = { version = "1", features = ["full"] }
reqwest      = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
url          = "2"
axum         = "0.7"
once_cell    = "1"
anyhow       = "1"
regex        = "1"
json5        = "0.4"
num_cpus     = "1"
async-trait  = "0.1"
cached       = { version = "0.53", features = ["async", "async_tokio_rt_multi_thread"] }
m3u8-rs      = "6"
xxhash-rust  = { version = "0.8", features = ["xxh3"] }
default-net  = "0.21"
log          = "0.4"
env_logger   = "0.11"
base64       = "0.22"
aws-sdk-s3   = { version = "1", features = [] }
aws-config   = "1"
urlencoding  = "2"
